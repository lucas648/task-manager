<header class="site-nav">
  <a class="brand" routerLink="/">TaskFlow AI</a>

  <nav aria-label="Navegacao principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>
    <a routerLink="/tasks" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Tasks
    </a>
    <a
      routerLink="/tasks/new"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Nova task
    </a>
    <a routerLink="/chaos" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Chaos
    </a>
    <a
      routerLink="/analytics"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Analytics
    </a>
  </nav>

  <button
    type="button"
    class="theme-toggle"
    (click)="themeService.toggleTheme()"
    [attr.aria-pressed]="themeService.isDarkMode()"
    [attr.aria-label]="themeService.isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
  >
    {{ themeService.isDarkMode() ? 'Modo claro' : 'Modo escuro' }}
  </button>
</header>

<router-outlet />
