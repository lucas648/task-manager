<h1>Portal CMS com Validação por IA</h1>

<form [formGroup]="form">
  <label>
    Título
    <input formControlName="title" />
  </label>

  <label>
    Descrição
    <textarea formControlName="description"></textarea>
  </label>

  <label>
    Categoria
    <input formControlName="category" />
  </label>

  <label>
    Tags
    <input formControlName="tags" placeholder="tag1, tag2, tag3" />
  </label>
</form>

<button (click)="analyzeWithAi()" [disabled]="loadingAi">
  {{ loadingAi ? 'Analisando...' : 'Analisar com IA' }}
</button>

<section *ngIf="suggestions.length">
  <h2>Sugestões da IA</h2>

  <article *ngFor="let suggestion of suggestions">
    <strong>{{ suggestion.field }}</strong>
    <p>Original: {{ suggestion.originalValue }}</p>
    <p>Sugestão: {{ suggestion.suggestedValue }}</p>
    <p>Motivo: {{ suggestion.reason }}</p>

    <button (click)="applySuggestion(suggestion)">
      Aplicar sugestão
    </button>
  </article>
</section>

<button *ngIf="status === 'ai_analyzed'" (click)="approveHumanReview()">
  Aprovar revisão humana
</button>

<section *ngIf="generatedJson">
  <h2>JSON gerado</h2>
  <pre>{{ generatedJson | json }}</pre>

  <button (click)="sendToCms()" [disabled]="sendingCms">
    {{ sendingCms ? 'Enviando...' : 'Enviar ao CMS' }}
  </button>
</section>

<p>Status atual: {{ status }}</p>
