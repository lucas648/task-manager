<main class="task-shell auth-shell">
  <section class="auth-layout" aria-label="Login">
    <div>
      <p class="eyebrow">Acesso</p>
      <h1>Entrar no TaskFlow AI</h1>
      <p class="hero-copy">
        Use um perfil demo para acessar o board, revisar tasks e acompanhar analytics.
      </p>
    </div>

    <form class="auth-panel" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      <button class="primary-action" type="submit">Entrar</button>

      @if (loginError) {
        <p class="form-error">{{ loginError }}</p>
      } @else if (loginForm.invalid && loginForm.touched) {
        <p class="form-error">Informe e-mail e senha para continuar.</p>
      }
    </form>
  </section>

  <section class="demo-users" aria-label="Perfis demo">
    @for (user of demoUsers; track user.id) {
      <button type="button" class="demo-user" (click)="useDemoUser(user.email, user.password)">
        <strong>{{ user.displayName }}</strong>
        <span>{{ user.email }}</span>
        <small>{{ user.role }}</small>
      </button>
    }
  </section>
</main>
